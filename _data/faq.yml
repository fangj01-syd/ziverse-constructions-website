# Common Questions. Answers are formatted text (HTML).
items:
- question: How much will my job cost?
  answer: <p>Every job is different, so we don't use price lists. After a free on-site visit, you get a fixed-price, itemised written quote, with no vague allowances and no surprises later.</p>
- question: Do I need council approval for a deck?
  answer: '<p>Often not. In NSW many small decks count as <strong>exempt development</strong>: in most residential zones that generally means no more than 25&nbsp;m², a floor no more than 1&nbsp;m above ground, at least 900&nbsp;mm from the boundary and behind the building line. Bigger or higher decks need a CDC or DA. We check your site and tell you which applies before we quote. <a href="https://www.planningportal.nsw.gov.au/development-and-assessment/planning-approval-pathways/exempt-development/balconies-decks-and-patios" target="_blank" rel="noopener">NSW Planning Portal rules&nbsp;↗</a></p>'
- question: How much deposit do you ask for?
  answer: <p>Never more than 10% of the contract price, which is the NSW limit. The rest is paid in stages set out in your contract as the work progresses.</p>
- question: Will I get a written contract?
  answer: <p>Yes. NSW law requires a written contract for any job over $5,000. Jobs over $20,000 also need home warranty insurance (HBCF) in place before any deposit is taken, and come with a 5-business-day cooling-off period.</p>
- question: Are you licensed and insured?
  answer: <p>Yes. Ziverse Constructions works under NSW contractor licence <strong>471023C</strong> (licensee Zhibin Lin) and carries $5 million public and products liability insurance.</p>
- question: Is the work guaranteed?
  answer: '<p>All residential building work in NSW is covered by statutory warranties: 6 years for major defects and 2 years for other defects. We also walk through the finished job with you at handover.</p>'
- question: How long will it take?
  answer: <p>It depends on the size of the job and any approvals. Your quote includes a start date and an expected timeframe, and you get regular progress updates and photos along the way.</p>
- question: Which areas do you cover?
  answer: <p>All of Greater Sydney and the Blue Mountains, including the Hills District, Western Sydney, Parramatta, the Inner West, North Shore, Northern Beaches, Eastern Suburbs, St George &amp; Sutherland Shire and South West Sydney.</p>
