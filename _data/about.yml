heading: Owner-operated, so the person quoting the job is the person building it.
text: Ziverse Constructions is run by Bing (Zhibin) Lin, a NSW-licensed contractor in carpentry and kitchen, bathroom & laundry renovation. Since 2020 Bing has personally quoted, managed and worked on every job, so you deal with the same person from the first site visit to handover.
